[project]
name = "fde-gateway"
version = "0.1.0"
description = "Decision instrument for the member-chat-at-peak use case: options replay, shadow-mode tiered gateway, pre-registered gates."
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fde_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-v --doctest-modules"
